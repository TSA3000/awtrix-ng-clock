name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout can turn the pushed annotated tag into a lightweight one, which loses its message
      - name: Fetch tags
        run: git fetch --tags --force

      - name: Build zip
        run: |
          name="awtrix-ng-clock-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          cp -r clocktemp.be README.md LICENSE blueprints homeassistant node-red images "dist/$name/"
          (cd dist && zip -r "$name.zip" "$name")

      - name: Write release notes
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..$GITHUB_REF_NAME"
          else
            range="$GITHUB_REF_NAME"
          fi
          {
            echo
            echo "## Changes"
            git log --no-merges --format='- %s' "$range"
          } >> notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "dist/awtrix-ng-clock-${GITHUB_REF_NAME}.zip" \
            clocktemp.be
